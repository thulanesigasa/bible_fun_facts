name: Compile App & Publish OTA Updates

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/**'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        type: choice
        default: 'publish_ota'
        options:
          - 'publish_ota'
          - 'compile_native_app'
          - 'both'
      ota_channel:
        description: 'OTA Update Channel'
        required: false
        type: choice
        default: 'both'
        options:
          - 'both'
          - 'production'
          - 'preview'
      platform:
        description: 'Native build platform (for compile_native_app)'
        required: false
        type: choice
        default: 'android'
        options:
          - 'android'
          - 'ios'
          - 'all'
      build_profile:
        description: 'EAS Build Profile (for compile_native_app)'
        required: false
        type: choice
        default: 'preview'
        options:
          - 'preview'
          - 'production'
          - 'development'
      compile_build_number:
        description: 'Custom native build number (leave blank to auto-use GitHub Run Number)'
        required: false
        type: string
        default: ''

jobs:
  # Job 1: Publish Over-The-Air Updates (Both Preview & Production Channels)
  publish_ota:
    name: Publish Expo OTA Updates
    if: github.event_name == 'push' || inputs.action == 'publish_ota' || inputs.action == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Verify TypeScript & Config
        run: |
          npx tsc --noEmit
          npx expo config --type public

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Publish to Production Channel
      - name: Publish OTA Update to Production Channel
        if: github.event_name == 'push' || inputs.ota_channel == 'production' || inputs.ota_channel == 'both'
        run: |
          npx eas update --branch production --message "${{ github.event.head_commit.message || 'Automated OTA production update from GitHub' }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # Publish to Preview Channel
      - name: Publish OTA Update to Preview Channel
        if: github.event_name == 'push' || inputs.ota_channel == 'preview' || inputs.ota_channel == 'both'
        run: |
          npx eas update --branch preview --message "${{ github.event.head_commit.message || 'Automated OTA preview update from GitHub' }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Job 2: Compile Native Binary on GitHub Actions
  compile_native_app:
    name: Compile Native Binary
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'compile_native_app' || inputs.action == 'both')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Inject Incremental Compilation Build Version
        run: |
          # Set dynamic build number while preserving version 1.0.1 and runtimeVersion 1.0.1
          BUILD_NUM="${{ inputs.compile_build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="${{ github.run_number }}"
          fi
          echo "Compiling native build with dynamic build number: $BUILD_NUM (runtimeVersion remains 1.0.1)"
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android.versionCode = parseInt('$BUILD_NUM') || 1;
            app.expo.ios.buildNumber = String('$BUILD_NUM') || '1';
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "
          git diff app.json

      - name: Verify Configuration
        run: npx expo config --type public

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Compile Native Binary via EAS Build
        run: |
          npx eas build --platform ${{ inputs.platform }} --profile ${{ inputs.build_profile }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
