name: Compile App & Publish OTA Updates

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/**'
      - '.npmrc'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        type: choice
        default: 'publish_ota'
        options:
          - 'publish_ota'
          - 'compile_native_app'
          - 'both'
      ota_channel:
        description: 'OTA Update Channel'
        required: false
        type: choice
        default: 'both'
        options:
          - 'both'
          - 'production'
          - 'preview'
      platform:
        description: 'Native build platform (for compile_native_app)'
        required: false
        type: choice
        default: 'android'
        options:
          - 'android'
          - 'ios'
          - 'all'
      build_profile:
        description: 'EAS Build Profile (for compile_native_app)'
        required: false
        type: choice
        default: 'preview'
        options:
          - 'preview'
          - 'production'
          - 'development'
      compile_build_number:
        description: 'Custom native build number (leave blank to auto-use GitHub Run Number)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  # Job 1: Publish Over-The-Air Updates (Both Preview & Production Channels)
  publish_ota:
    name: Publish Expo OTA Updates
    if: github.event_name == 'push' || inputs.action == 'publish_ota' || inputs.action == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefer-offline --no-audit

      - name: Verify TypeScript & Config
        run: |
          npx tsc --noEmit
          npx expo config --type public

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Publish to Production Channel
      - name: Publish OTA Update to Production Channel
        if: github.event_name == 'push' || inputs.ota_channel == 'production' || inputs.ota_channel == 'both'
        run: |
          eas update --branch production --message "${{ github.event.head_commit.message || 'Automated OTA production update from GitHub' }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # Publish to Preview Channel
      - name: Publish OTA Update to Preview Channel
        if: github.event_name == 'push' || inputs.ota_channel == 'preview' || inputs.ota_channel == 'both'
        run: |
          eas update --branch preview --message "${{ github.event.head_commit.message || 'Automated OTA preview update from GitHub' }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Job 2: Compile Native Android APK directly on GitHub Actions Runners
  compile_native_app:
    name: Compile Native Android APK on GitHub
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'compile_native_app' || inputs.action == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefer-offline --no-audit

      - name: Inject Incremental Compilation Build Version
        run: |
          BUILD_NUM="${{ inputs.compile_build_number || github.run_number }}"
          echo "Compiling native build with dynamic build number: $BUILD_NUM (runtimeVersion remains 1.0.1)"
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android.versionCode = parseInt('$BUILD_NUM') || 1;
            app.expo.ios.buildNumber = String('$BUILD_NUM') || '1';
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "
          git diff app.json

      - name: Prebuild Native Android Project
        run: |
          npx expo prebuild --platform android --no-install
          # Configure Gradle memory limits to prevent Metaspace OutOfMemoryError on GitHub runners
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties

      - name: Build Android Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test --no-daemon --stacktrace
        env:
          _JAVA_OPTIONS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.parallel=false"

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/exegeomai-v1.0.1.apk
          ls -lh build-output/

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exegeomai-v1.0.1-apk
          path: build-output/exegeomai-v1.0.1.apk

      - name: Publish APK to GitHub Release Assets
        run: |
          BUILD_NUM="${{ inputs.compile_build_number || github.run_number }}"
          RELEASE_TAG="v1.0.1"
          RELEASE_TITLE="exégeomai v1.0.1"
          
          RELEASE_BODY="### Native Build Artifacts (Built on GitHub Actions)

          - **Platform**: Android
          - **Artifact**: \`exegeomai-v1.0.1.apk\`
          - **Build Environment**: GitHub Actions Ubuntu Runner (Java 17 + Gradle)
          - **Native Build Number**: ${BUILD_NUM}
          - **Runtime Version**: 1.0.1
          - **OTA Update Support**: Enabled via Expo Updates (runtimeVersion 1.0.1)

          Download the standalone \`exegeomai-v1.0.1.apk\` below directly from the release Assets."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Updating existing release $RELEASE_TAG..."
            gh release edit "$RELEASE_TAG" --notes "$RELEASE_BODY"
          else
            echo "Creating new release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$RELEASE_BODY"
          fi

          echo "Uploading APK to GitHub Release $RELEASE_TAG assets..."
          gh release upload "$RELEASE_TAG" build-output/exegeomai-v1.0.1.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
