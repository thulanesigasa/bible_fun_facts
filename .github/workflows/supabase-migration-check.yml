name: Supabase Migration Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-migration-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local_migrations:
    name: Apply SQL Migrations to Disposable Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start disposable local Supabase
        run: supabase start

      - name: Reapply all migrations from clean database
        run: supabase db reset --local

      - name: Verify anonymous and cross-account RLS boundaries
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/tests/security_access.sql

      - name: Stop disposable local instance
        if: always()
        run: supabase stop --no-backup
