name: Repair Expo SDK 57 Lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/repair-expo-lock.yml'

permissions:
  contents: write

jobs:
  repair_lock:
    if: github.head_ref == 'production-readiness/master-prompt-1-20261012'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate npm lockfile
        run: npm install --legacy-peer-deps --package-lock-only --ignore-scripts --no-audit

      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate Expo SDK 57 lockfile"
          git push origin HEAD:${{ github.head_ref }}
